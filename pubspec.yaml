name: money_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.3
  # Routing
  auto_route: 8.3.0

  # State Management
  flutter_bloc: ^8.1.3

  # Network
  dio: ^5.4.0

  # Dependency Injection
  get_it: ^7.6.4
  injectable: 2.3.2

  # Backend
  supabase_flutter: ^2.12.0

  # Env
  flutter_dotenv: ^5.1.0

  # Utils
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  intl: any
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  build_runner: any
  freezed: ^2.5.2
  json_serializable: any
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/fotka.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/finance tracker.webp"
  adaptive_icon_background: "#5E3FBE"
  adaptive_icon_foreground: "assets/finance tracker.webp"
  remove_alpha_ios: true
