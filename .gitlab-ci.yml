image: registry.gitlab.com/bekzhandyace1/dyace_app/flutter-fastlane-amd64:latest

stages:
  - dev
  - release

variables:
  LC_ALL: "en_US.UTF-8"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  JAVA_TOOL_OPTIONS: "-Xmx3g -XX:MaxMetaspaceSize=512m"
  BUILD_NUMBER: "$CI_PIPELINE_IID"

cache:
  key: "flutter-android-linux-protected"
  paths:
    - .pub-cache/
    - .gradle/
    - android/.gradle/

default:
  before_script:
    - cd $CI_PROJECT_DIR
    - flutter --version
    - flutter pub get
    - yes | sdkmanager --licenses || true

# Просто инфо-джоб (по желанию)
debug:runner-info:
  stage: dev
  script:
    - uname -a
    - which flutter || echo "flutter not in PATH"
    - flutter --version
    - ls -R /sdks/flutter/bin/cache/artifacts/engine || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

dev:ui-demo-artifact:
  stage: dev
  before_script: [] # ничего не устанавливаем, просто прикрепляем файл
  script:
    - echo "Attach UI demo video as artifact"
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/demo.mp4
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/burger-menu"'

# Подготовка keystore / google-services.json
prepare:keystore-and-config:
  stage: dev
  script:
    - mkdir -p android/app

    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
      else
        echo "⚠️ ANDROID_KEYSTORE_BASE64 is empty"
      fi

    - |
      cat > android/key.properties <<EOF
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      storeFile=upload-keystore.jks
      EOF

    - |
      if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
        echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      else
        echo "ℹ️ GOOGLE_SERVICES_JSON_BASE64 is empty, skipping google-services.json"
      fi
  artifacts:
    expire_in: 7 days
    paths:
      - android/app/upload-keystore.jks
      - android/key.properties
      - android/app/google-services.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

# Сборка и заливка в Firebase
release:android:
  stage: release
  needs: ["prepare:keystore-and-config"]
  before_script:
    # Проверяем наличие Supabase credentials
    - |
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "❌ ОШИБКА: Не установлены переменные окружения SUPABASE_URL или SUPABASE_ANON_KEY"
        echo "💡 Добавьте их в GitLab CI/CD → Settings → CI/CD → Variables"
        exit 1
      fi
      echo "✅ Supabase credentials проверены"
  script:
    - cd $CI_PROJECT_DIR/android

    - |
      echo "📦 Создаю fastlane/firebase-service-account.json..."
      mkdir -p fastlane

      if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
        echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 пуст, выйду с ошибкой"
        exit 1
      fi

      echo "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > fastlane/firebase-service-account.json

      echo "📂 Содержимое android/fastlane:"
      pwd
      ls -la fastlane
      echo "🔍 Первые строки файла:"
      head -n 5 fastlane/firebase-service-account.json || true

    - fastlane android firebase
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual

# Общая подготовка для iOS (Flutter через FVM или системный, .env, CocoaPods)
.ios:before_script: &ios_before_script
  - export PATH="/opt/homebrew/bin:$PATH:$HOME/development/flutter/bin"
  - cd $CI_PROJECT_DIR
  - if command -v fvm >/dev/null 2>&1 && [ -f .fvmrc ]; then fvm install && export PATH="$CI_PROJECT_DIR/.fvm/flutter_sdk/bin:$PATH"; fi
  - flutter clean
  - flutter pub get
  - flutter build ios --config-only --release --build-number=$BUILD_NUMBER
  - |
    if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
      echo "❌ ОШИБКА: SUPABASE_URL или SUPABASE_ANON_KEY не заданы в GitLab CI/CD Variables!"
      exit 1
    fi
    printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > $CI_PROJECT_DIR/.env
    echo "✅ .env файл создан"
  - cd ios
  - bundle install --path vendor/bundle
  - pod install --repo-update

# TestFlight (App Store Connect)
release:ios:testflight:
  stage: release
  tags:
    - my-mac-runner
  before_script: *ios_before_script
  script:
    - |
      if [ -z "$APP_STORE_API_KEY_BASE64" ]; then
        echo "❌ ОШИБКА: APP_STORE_API_KEY_BASE64 не задан. GitLab → Settings → CI/CD → Variables"
        exit 1
      fi
    - echo "$APP_STORE_API_KEY_BASE64" | base64 -d > fastlane/AuthKey_TZW43M7B7J.p8
    - bundle exec fastlane testflight
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual

# Firebase App Distribution (iOS)
release:ios:firebase:
  stage: release
  tags:
    - my-mac-runner
  before_script: *ios_before_script
  script:
    - |
      if [ -z "$APP_STORE_API_KEY_BASE64" ]; then
        echo "❌ ОШИБКА: APP_STORE_API_KEY_BASE64 не задан."
        exit 1
      fi
    - echo "$APP_STORE_API_KEY_BASE64" | base64 -d > fastlane/AuthKey_TZW43M7B7J.p8
    - |
      if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" ] || [ -z "$FIREBASE_APP_ID_IOS" ]; then
        echo "❌ ОШИБКА: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 или FIREBASE_APP_ID_IOS не заданы."
        exit 1
      fi
    - echo "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > fastlane/firebase-service-account.json
    - bundle exec fastlane firebase
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
