# ─────────────────────────────────────────────────────────────────────────────
# Кастомный CI образ хранится в GitLab Container Registry.
# Пересобирается только при изменении Dockerfile.ci (вручную или auto).
# ─────────────────────────────────────────────────────────────────────────────
variables:
  LC_ALL: "en_US.UTF-8"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  JAVA_TOOL_OPTIONS: "-Xmx3g -XX:MaxMetaspaceSize=512m"
  BUILD_NUMBER: "$CI_PIPELINE_IID"
  # Адрес образа в GitLab Registry этого проекта
  CI_IMAGE: "$CI_REGISTRY_IMAGE/ci-runner:latest"

stages:
  - docker
  - dev
  - release

cache:
  key: "flutter-android-linux-v2"
  paths:
    - .pub-cache/
    - .gradle/
    - android/.gradle/

# ─────────────────────────────────────────────────────────────────────────────
# Сборка и публикация кастомного Docker образа
# Запускается только при изменении Dockerfile.ci вручную или в main
# ─────────────────────────────────────────────────────────────────────────────
build:docker-image:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile.ci -t "$CI_IMAGE" .
    - docker push "$CI_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile.ci
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# Вспомогательный job: информация о runner-е
# ─────────────────────────────────────────────────────────────────────────────
debug:runner-info:
  stage: dev
  image: "$CI_IMAGE"
  script:
    - uname -a
    - flutter --version
    - ruby --version
    - bundle --version
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ─────────────────────────────────────────────────────────────────────────────
# Подготовка Keystore и Google Services JSON из CI/CD переменных
# ─────────────────────────────────────────────────────────────────────────────
prepare:keystore-and-config:
  stage: dev
  image: "$CI_IMAGE"
  before_script:
    - flutter pub get
  script:
    - mkdir -p android/app

    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
      else
        echo "⚠️ ANDROID_KEYSTORE_BASE64 is empty"
      fi

    - |
      cat > android/key.properties <<EOF
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      storeFile=upload-keystore.jks
      EOF

    - |
      if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
        echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
      else
        echo "ℹ️ GOOGLE_SERVICES_JSON_BASE64 is empty, skipping"
      fi
  artifacts:
    expire_in: 7 days
    paths:
      - android/app/upload-keystore.jks
      - android/key.properties
      - android/app/google-services.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

# ─────────────────────────────────────────────────────────────────────────────
# Сборка и публикация APK в Firebase App Distribution
# ─────────────────────────────────────────────────────────────────────────────
release:android:
  stage: release
  image: "$CI_IMAGE"
  needs: ["prepare:keystore-and-config"]
  before_script:
    - |
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "❌ ERROR: SUPABASE_URL or SUPABASE_ANON_KEY missing"
        exit 1
      fi
      echo "✅ Supabase credentials OK"
    - flutter pub get
  script:
    - cd $CI_PROJECT_DIR/android

    - |
      echo "📦 Decoding firebase-service-account.json..."
      mkdir -p fastlane
      if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
        echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 is empty"
        exit 1
      fi
      echo "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > fastlane/firebase-service-account.json

    # Gems уже установлены в образе — bundle install не нужен
    - bundle exec fastlane android firebase
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
